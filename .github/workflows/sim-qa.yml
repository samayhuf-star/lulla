# Lulla iOS Simulator run (build 8 pre-TestFlight check).
# Manual trigger ONLY (workflow_dispatch). Pushing never starts it.
# Compiles a Release iphonesimulator .app on the runner with EXPO_PUBLIC_LULLA_QA=1, which
# turns on the QA deep links (lulla://qa/play/<id>) and the playback-position overlay.
# Store/EAS builds never set that variable. No secrets are used.
name: Lulla iOS Simulator QA

on:
  workflow_dispatch:
    inputs:
      sounds:
        description: Comma-separated sound ids to play and screenshot
        required: false
        default: snow,cave,drip,farm,grassland,rain_puddle

concurrency:
  group: lulla-sim-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-qa:
    name: Simulator QA
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.samay.lulla
      OUT: /tmp/lulla-sim-qa
      DERIVED_DATA: ${{ github.workspace }}/ios/DerivedData
      EXPO_PUBLIC_LULLA_QA: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Boot iPhone simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ph=[(r,x["name"],x["udid"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]
          pref=["iPhone 16 Pro Max","iPhone 16 Plus","iPhone 16","iPhone 15 Pro Max","iPhone 15"]
          ph.sort(key=lambda p: pref.index(p[1]) if p[1] in pref else 99)
          print(ph[0][2])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Pods
        working-directory: ios
        run: pod install

      - name: Build Release simulator app
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          WS=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild build -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO \
            | tee "$OUT/xcodebuild.log" | tail -n 40

      - name: Install, launch and play each sound
        run: |
          set -euo pipefail
          APP=$(find "$DERIVED_DATA" -name '*.app' -path '*Release-iphonesimulator*' | head -n1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl io "$UDID" screenshot "$OUT/00-home.png"
          IFS=',' read -ra IDS <<< "${{ github.event.inputs.sounds }}"
          for id in "${IDS[@]}"; do
            xcrun simctl openurl "$UDID" "lulla://qa/play/$id"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$OUT/$id-a.png"
            sleep 4
            xcrun simctl io "$UDID" screenshot "$OUT/$id-b.png"   # overlay position must have advanced vs -a
          done
          xcrun simctl openurl "$UDID" "lulla://qa/stop"
          sleep 2
          xcrun simctl openurl "$UDID" "lulla://qa/paywall"
          sleep 10
          xcrun simctl io "$UDID" screenshot "$OUT/zz-paywall.png"   # prices exactly as StoreKit returns them

          # Free tier after the premium preview is used up (QA build only, memory only).
          shot() { xcrun simctl io "$UDID" screenshot "$OUT/$1.png"; }
          xcrun simctl openurl "$UDID" "lulla://qa/close"; sleep 2
          xcrun simctl openurl "$UDID" "lulla://qa/stop"; sleep 3
          xcrun simctl openurl "$UDID" "lulla://qa/preview/used"; sleep 2
          shot f0-home-preview-used          # Premium badges on every non-free tile, pill says Unlock all
          xcrun simctl openurl "$UDID" "lulla://qa/tap/rain"; sleep 6
          shot f1-free-rain-playing-a        # free sound plays with the preview used up
          sleep 4
          shot f1-free-rain-playing-b        # overlay position about 4 s later than -a
          xcrun simctl openurl "$UDID" "lulla://qa/tap/snow"; sleep 8
          shot f2-locked-snow-paywall        # locked tile opens the paywall: X, Unlock all sounds, Restore
          xcrun simctl openurl "$UDID" "lulla://qa/close"; sleep 4
          shot f3-home-after-x-a             # back on home, rain still playing
          sleep 4
          shot f3-home-after-x-b
          xcrun simctl openurl "$UDID" "lulla://qa/settings"; sleep 4
          shot f4-settings-restore           # Restore purchases outside the paywall
          xcrun simctl openurl "$UDID" "lulla://qa/close"; sleep 2

          # Frequencies hero card on home (All selected), then a tap on it selects Frequencies
          # (432 Hz Deep Sleep free, the other four Premium).
          xcrun simctl openurl "$UDID" "lulla://qa/cat/all"; sleep 3
          shot h0-home-frequencies-hero
          xcrun simctl openurl "$UDID" "lulla://qa/hero"; sleep 3
          shot h1-after-hero-tap-frequencies

          # Sleep timer: the options (4 hours and All night), a 2 h timer with its computed
          # end and fade start (overlay + log), then All night (no stop scheduled).
          xcrun simctl openurl "$UDID" "lulla://qa/timersheet"; sleep 3
          shot t0-timer-options
          xcrun simctl openurl "$UDID" "lulla://qa/close"; sleep 2
          xcrun simctl openurl "$UDID" "lulla://qa/tap/freq_432"; sleep 3
          xcrun simctl openurl "$UDID" "lulla://qa/timer/120"; sleep 4
          shot t1-timer-2h
          xcrun simctl openurl "$UDID" "lulla://qa/timer/allnight"; sleep 4
          shot t2-timer-allnight

          # Loop wrap: play 432 Hz Deep Sleep from 4 s before its loop point, one shot a second.
          xcrun simctl openurl "$UDID" "lulla://qa/wrap/freq_432"; sleep 4
          for i in 1 2 3 4 5 6 7 8; do shot "w-wrap-$i"; sleep 1; done
          xcrun simctl openurl "$UDID" "lulla://qa/stop"
          xcrun simctl spawn "$UDID" log show --last 30m --predicate 'process == "Lulla"' > "$OUT/app.log" 2>&1 || true
          grep -F '[QA]' "$OUT/app.log" > "$OUT/qa-events.log" || echo "no [QA] lines in the device log" > "$OUT/qa-events.log"

      - name: Store shots at 6.5 inch (iPhone 11 Pro Max class)
        if: always()
        run: |
          set -uo pipefail
          # 6.9 inch store shots come from the main run above (iPhone 16 Pro Max, 1320 x 2868).
          # Here: the same app on a 6.5 inch device (1242 x 2688), falling back to iPhone 14 Plus
          # (1284 x 2778, also accepted in the 6.5 inch slot). If neither device type exists on the
          # runner, the 6.9 inch shot is resized to 1242 x 2688 and the file name says so.
          mkdir -p "$OUT/store65"
          APP=$(find "$DERIVED_DATA" -name '*.app' -path '*Release-iphonesimulator*' | head -n1)
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["platform"]=="iOS"]; print(r[-1]["identifier"])')
          U65=""
          for T in iPhone-11-Pro-Max iPhone-XS-Max iPhone-14-Plus; do
            U65=$(xcrun simctl create "QA 6.5 $T" "com.apple.CoreSimulator.SimDeviceType.$T" "$RT" 2>/dev/null) && { echo "6.5 device: $T on $RT" | tee "$OUT/store65/device.txt"; break; }
          done
          if [ -n "$U65" ]; then
            xcrun simctl boot "$U65"; xcrun simctl bootstatus "$U65" -b
            xcrun simctl status_bar "$U65" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$U65" "$APP"
            xcrun simctl launch "$U65" "$BUNDLE_ID"; sleep 10
            xcrun simctl openurl "$U65" "lulla://qa/cat/all"; sleep 3
            xcrun simctl io "$U65" screenshot "$OUT/store65/s65-home-frequencies-hero.png"
            xcrun simctl openurl "$U65" "lulla://qa/hero"; sleep 3
            xcrun simctl io "$U65" screenshot "$OUT/store65/s65-after-hero-tap.png"
            xcrun simctl shutdown "$U65" || true
          else
            echo "no 6.5 inch device type on this runner; resized from 6.9 inch" | tee "$OUT/store65/device.txt"
            for f in h0-home-frequencies-hero h1-after-hero-tap-frequencies; do
              [ -f "$OUT/$f.png" ] && sips -z 2688 1242 "$OUT/$f.png" --out "$OUT/store65/s65-RESIZED-$f.png" >/dev/null
            done
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lulla-sim-qa
          path: /tmp/lulla-sim-qa/**
